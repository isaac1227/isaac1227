services:
  backend:
    image: python:3.11-slim
    working_dir: /workspace
    command: python -m http.server 8000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - .:/workspace
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-env}
      DATABASE_URL: ${DATABASE_URL:-postgresql://profile_user:profile_password@postgres:5432/profile_dev}
    depends_on:
      - postgres

  frontend:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -c "npm --version && tail -f /dev/null"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - .:/workspace
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-profile_dev}
      POSTGRES_USER: ${POSTGRES_USER:-profile_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-profile_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-profile_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-profile_password}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
